name: Kronos AI Forecast Cache

on:
  schedule:
    # 6:30 AM IST = 1:00 UTC, Mon–Fri
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  kronos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync deps + CPU torch (Linux)
        run: uv sync

      - name: Refresh Kronos cache
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: |
          uv run --no-sync --directory scanner python -c "
          import asyncio
          from scheduler import run_daily_kronos_cache
          asyncio.run(run_daily_kronos_cache())
          "

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node deps + Prisma
        run: |
          npm ci
          npx prisma generate

      - name: Require Turso for UI sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            if [ -z "$DATABASE_URL" ]; then
              echo "::error::Set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN (preferred) or DATABASE_URL so forecasts reach the UI."
              exit 1
            fi
            echo "::warning::Turso secrets missing — falling back to DATABASE_URL only."
          else
            echo "Turso secrets are set"
          fi

      - name: Sync Kronos cache → Turso + notify UI
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx --tsconfig tsconfig.json scripts/ci/sync-kronos-cache-to-turso.ts

      - name: Upload scanner DB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kronos-tauric-db-${{ github.run_id }}
          path: scanner/tauric.db
          if-no-files-found: ignore
          retention-days: 14
