[project]
name = "tradesim-scanner"
version = "1.0.0"
description = "Tauric Research swing trade scanner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "yfinance==1.5.2",
    "pandas>=2.2.3",
    "numpy>=2.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "apscheduler==3.10.4",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "safetensors==0.6.2",
    "tqdm==4.67.1",
    "torch",
]

[tool.uv]
package = false

# Use the local CPU wheel (already downloaded) so sync is fast and offline-friendly.
# Re-download once with curl if missing, then point here.
[tool.uv.sources]
torch = { path = "wheels/torch-2.13.0+cpu-cp312-cp312-win_amd64.whl" }
